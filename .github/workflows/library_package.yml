name: Library package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and install the library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs reads the version from the tags
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          python-version: "3.12"
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Install as a consumer would
        run: |
          uv venv --no-config "$RUNNER_TEMP/consumer"
          uv pip install --no-config --python "$RUNNER_TEMP/consumer" dist/*.whl
          cd "$RUNNER_TEMP"
          consumer/bin/python -c "import connect.server.app; from connect.workspace import assets_dir, ui_build_dir; assert ui_build_dir(); open('assets_dir', 'w').write(str(assets_dir()))"
          assets=$(cat assets_dir)
          diff <(git -C "$GITHUB_WORKSPACE" ls-files connect/assets | sed 's#^connect/assets/##' | sort) \
               <(cd "$assets" && find . -type f -not -path '*/__pycache__/*' | sed 's#^\./##' | sort)
          test -x "$assets/ocb/install.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
