[tox]
skip_missing_interpreters = true
isolated_build = True
uv_seed = true

[testenv]
passenv = *

[testenv:bandit]
skipsdist = True
skip_install = True
deps =
    tomte[bandit]==0.7.0
commands =
    bandit -r connect packages \
        -x packages/valory/connections,packages/valory/protocols,packages/open_aea
    bandit -s B101 -r tests

[testenv:check-copyright]
skipsdist = True
skip_install = True
deps =
    tomte[cli]==0.7.0
commands =
    tomte check-copyright --author "Valory AG" --scan-path connect --scan-path tests \
        --scan-path packages -e connections -e protocols -e open_aea

[testenv:fix-copyright]
skipsdist = True
skip_install = True
deps =
    tomte[cli]==0.7.0
commands =
    tomte format-copyright --author "Valory AG" --scan-path connect --scan-path tests \
        --scan-path packages -e connections -e protocols -e open_aea

[testenv:black]
skipsdist = True
skip_install = True
deps =
    tomte[black]==0.7.0
commands =
    black connect tests packages

[testenv:black-check]
skipsdist = True
skip_install = True
deps =
    tomte[black]==0.7.0
commands =
    black --check connect tests packages

[testenv:isort]
skipsdist = True
skip_install = True
deps =
    tomte[isort]==0.7.0
commands =
    isort connect/ tests/ packages/

[testenv:isort-check]
skipsdist = True
skip_install = True
deps =
    tomte[isort]==0.7.0
commands =
    isort --check-only --gitignore connect/ tests/ packages/

[testenv:flake8]
skipsdist = True
skip_install = True
deps =
    tomte[flake8]==0.7.0
    Flake8-pyproject>=1.2.3,<2
commands =
    flake8 connect tests packages

[testenv:mypy]
skipsdist = True
skip_install = True
deps =
    tomte[mypy]==0.7.0
    httpx==0.28.1  # typed package imported by tests; mypy needs the real module
commands =
    mypy connect/ tests/ packages/ --disallow-untyped-defs --config-file tox.ini

[testenv:pylint]
whitelist_externals = /bin/sh
skipsdist = True
# skip pip's package install: it cannot honor [tool.uv] override-dependencies
# (mech-client's transitive fastapi pin conflicts); uv sync below can.
skip_install = True
allowlist_externals = uv
commands_pre =
    uv sync --active --all-groups --frozen --inexact
deps =
    tomte[pylint]==0.7.0
commands =
    pylint connect packages -j 0

[testenv:safety]
skipsdist = True
skip_install = True
deps =
    tomte[safety]==0.7.0
    typer<0.17.0  # remove after this is fixed https://github.com/pyupio/safety/issues/784
    ; nltk 3.10.1 (a safety dependency) added an import hook that refuses any
    ; module resolving inside the current working directory. tox keeps its
    ; venvs in .tox/ under the project root, so from here every import safety
    ; makes of its own dependencies looks like CWD hijacking and the CLI dies
    ; before it scans anything. Drop this once the hook stops treating a
    ; project-local venv as the CWD.
    nltk<3.10.1
    ; safety>=3 (pulled in by tomte 0.7.0) breaks when paired with
    ; httpx>=0.28: pyup_api_client references the removed
    ; httpx.NetworkError. Pin until tomte catches up.
    httpx<0.28
commands_pre =
    ; safety scans this very env, including the pip that virtualenv seeds
    ; into it — keep that pip current so known-fixed advisories don't fail
    ; the check. uv-created venvs (tox-uv in CI) ship no pip at all, so
    ; skip quietly there. (The project's own locked pip is in uv.lock.)
    python -c 'import importlib.util as u, subprocess, sys; sys.exit(subprocess.call([sys.executable, "-m", "pip", "install", "--quiet", "--upgrade", "pip"]) if u.find_spec("pip") else 0)'
commands =
    safety check

[testenv:unit-tests]
allowlist_externals = uv
commands_pre =
    uv sync --active --all-groups --frozen --inexact
skip_install = True
deps =
    tomte[tests]==0.7.0
commands =
    pytest -m "not integration" -v --durations=100 {posargs:tests/}

[testenv:unit-tests-coverage]
allowlist_externals = uv
commands_pre =
    uv sync --active --all-groups --frozen --inexact
skip_install = True
deps =
    tomte[tests]==0.7.0
commands =
    pytest -m "not integration" -v --durations=100 --cov=connect --cov-report=xml --cov-report=term-missing --cov-fail-under=100 {posargs:tests/}

[coverage:run]
# Bundled agent-runtime skills are not part of the server's measured surface:
# they run in the agent's own environment (connect-polymarket needs
# py_clob_client_v2, pip-installed there, not a repo dep) and are covered by
# their own tests + a live e2e, mirroring the mypy exclude above.
omit =
    connect/assets/skills/*

[testenv:integration-tests]
allowlist_externals = uv
commands_pre =
    uv sync --active --all-groups --frozen --inexact
skip_install = True
deps =
    tomte[tests]==0.7.0
commands =
    pytest -m "integration" -v --durations=100 {posargs:tests/}

[mypy]
strict_optional = True
# connect-polymarket is a bundled agent-runtime skill: it depends on
# py_clob_client_v2 (pip-installed in the agent's environment, no type stubs,
# not a repo dependency) and wires its sibling-skill import at runtime via
# sys.path — neither of which mypy can follow. Its logic is covered by
# tests (tests/test_connect_polymarket_skill.py) instead.
exclude = ^(packages/valory/(connections|protocols)/|packages/open_aea/|connect/assets/skills/connect-polymarket/)

[mypy-web3.*]
ignore_missing_imports = True

[mypy-eth_account.*]
ignore_missing_imports = True

[mypy-eth_keys.*]
ignore_missing_imports = True

[mypy-eth_typing.*]
ignore_missing_imports = True

[mypy-hexbytes.*]
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-starlette.*]
ignore_missing_imports = True

[mypy-mcp.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-rlp.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-mech_client.*]
ignore_missing_imports = True

[mypy-safe_eth.*]
ignore_missing_imports = True

[mypy-eth_abi.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True
